name: Deploy web app to GitHub Pages

# Publishes the contents of 2-web-app/ to Pages, so the app keeps serving from
# the site root (https://rize17.github.io/datalogger/) while the repo holds the
# full project — firmware, Worker and docs alongside it.

on:
  push:
    branches: [main]
    paths:
      - '2-web-app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 2-web-app

      - id: deployment
        uses: actions/deploy-pages@v4
